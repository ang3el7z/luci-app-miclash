name: Build And Release From Tag
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sync-version:
    name: Sync Version To Branch
    runs-on: ubuntu-22.04
    outputs:
      tag_version: ${{ steps.tag.outputs.tag_version }}
      target_branch: ${{ steps.branch.outputs.target_branch }}
      source_tag_sha: ${{ steps.source.outputs.source_tag_sha }}
      sync_sha: ${{ steps.sync.outputs.sync_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Record Source Tag Commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_TAG_SHA="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "source_tag_sha=$SOURCE_TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Parse Tag Version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"

          if [ "$TAG_VERSION" = "$TAG_NAME" ]; then
            echo "Tag must start with 'v' (example: v1.2.3)." >&2
            exit 1
          fi

          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag version: $TAG_VERSION" >&2
            exit 1
          fi

          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect Target Branch From Tag Commit
        id: branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

          mapfile -t BRANCHES < <(git branch -r --contains "$GITHUB_SHA" | sed 's/^[*[:space:]]*//' | grep -v 'origin/HEAD' | sed 's#^origin/##' || true)

          TARGET_BRANCH=""
          for b in "${BRANCHES[@]}"; do
            if [ "$b" != "$DEFAULT_BRANCH" ]; then
              TARGET_BRANCH="$b"
              break
            fi
          done

          if [ -z "$TARGET_BRANCH" ] && [ "${#BRANCHES[@]}" -gt 0 ]; then
            TARGET_BRANCH="${BRANCHES[0]}"
          fi

          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="$DEFAULT_BRANCH"
          fi

          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Will sync version in branch: $TARGET_BRANCH"

      - name: Sync Version In Files And Push
        id: sync
        shell: bash
        env:
          TAG_VERSION: ${{ steps.tag.outputs.tag_version }}
          TARGET_BRANCH: ${{ steps.branch.outputs.target_branch }}
          SOURCE_TAG_SHA: ${{ steps.source.outputs.source_tag_sha }}
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git switch -C "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git switch --detach
          fi

          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG_VERSION"]

          makefile = pathlib.Path("luci-app-miclash/Makefile")

          for f in (makefile,):
              if not f.exists():
                  print(f"Required file not found: {f}", file=sys.stderr)
                  sys.exit(1)

          text = makefile.read_text(encoding="utf-8")
          text_new, changed = re.subn(r"^PKG_VERSION:=.*$", f"PKG_VERSION:={tag}", text, count=1, flags=re.M)
          if changed != 1:
              print("Failed to update PKG_VERSION in Makefile", file=sys.stderr)
              sys.exit(1)
          makefile.write_text(text_new, encoding="utf-8", newline="\n")
          PY

          if git diff --quiet; then
            echo "No version changes detected."
          else
            git add luci-app-miclash/Makefile
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "github-actions[bot]: sync Makefile version to v${TAG_VERSION}"
          fi

          SYNCED_BUILD_SHA="$(git rev-parse HEAD)"
          mapfile -t changed_paths < <(git diff --name-only "$SOURCE_TAG_SHA" "$SYNCED_BUILD_SHA")
          if [ "${#changed_paths[@]}" -gt 1 ] || \
             { [ "${#changed_paths[@]}" -eq 1 ] && [ "${changed_paths[0]}" != "luci-app-miclash/Makefile" ]; }; then
            printf 'Synchronized tree differs from tag outside the version file:\n' >&2
            printf '  %s\n' "${changed_paths[@]}" >&2
            exit 1
          fi

          export SYNCED_BUILD_SHA
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          path = "luci-app-miclash/Makefile"
          tag = os.environ["TAG_VERSION"]
          source_tag_sha = os.environ["SOURCE_TAG_SHA"]
          synced_build_sha = os.environ["SYNCED_BUILD_SHA"]

          def git_show(commit):
              return subprocess.check_output(
                  ["git", "show", f"{commit}:{path}"], text=True, encoding="utf-8")

          tagged = git_show(source_tag_sha)
          synced = git_show(synced_build_sha)
          expected, changed = re.subn(
              r"^PKG_VERSION:=.*$", f"PKG_VERSION:={tag}", tagged, count=1, flags=re.M)
          if changed != 1 or synced != expected:
              print("Synchronized Makefile is not the tagged Makefile with only PKG_VERSION updated.",
                    file=sys.stderr)
              sys.exit(1)
          PY

          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Target branch '${TARGET_BRANCH}' not found. Skipping push."
          fi

          echo "sync_sha=$SYNCED_BUILD_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.pkg_type }}, OpenWrt ${{ matrix.sdk_version }})
    runs-on: ubuntu-22.04
    needs: sync-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_version: "24.10.7"
            pkg_type: "ipk"
            arch: "x86/64"
          - sdk_version: "25.12.5"
            pkg_type: "apk"
            arch: "x86/64"
    env:
      PACKAGE_NAME: luci-app-miclash
      SDK_NAME: -sdk-
      SDK_URL_PATH: https://downloads.openwrt.org/releases/${{ matrix.sdk_version }}/targets/${{ matrix.arch }}/
    steps:
      - name: Checkout Synced Commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.sync-version.outputs.sync_sha }}
          fetch-depth: 1

      - name: Ensure Version Equals Tag
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^PKG_VERSION:=.*$/PKG_VERSION:=${{ needs.sync-version.outputs.tag_version }}/" luci-app-miclash/Makefile

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            bison build-essential clang file flex g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip wget xsltproc zstd

      - name: Create Build Directories
        run: |
          echo "SDK_DL_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
          echo "SDK_HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Download And Verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DL_DIR"

          if ! wget -q -O - "$SDK_URL_PATH/sha256sums" | grep -- "$SDK_NAME" > sha256sums.small 2>/dev/null; then
            echo "Cannot find SDK archive in sha256sums for $SDK_URL_PATH" >&2
            exit 1
          fi

          SDK_FILE="$(cut -d' ' -f2 < sha256sums.small | sed 's/*//g')"
          wget -q -O "$SDK_FILE" "$SDK_URL_PATH/$SDK_FILE"

          if ! sha256sum -c ./sha256sums.small >/dev/null 2>&1; then
            echo "SDK checksum verification failed." >&2
            exit 1
          fi

          tar --zstd -xf "$SDK_FILE" -C "$SDK_HOME" --strip=1

      - name: Build Package
        shell: bash
        env:
          TAG_VERSION: ${{ needs.sync-version.outputs.tag_version }}
        run: |
          set -euo pipefail
          cd "$SDK_HOME"
          ./scripts/feeds update > /dev/null 2>&1
          ./scripts/feeds install -a > /dev/null 2>&1
          ln -s "${{ github.workspace }}/luci-app-miclash" "package/$PACKAGE_NAME"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Config-build.in")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          current = ""
          package_defaults = 0
          required_defaults = {"PACKAGE_kmod-nf-tproxy"}
          retained_defaults = set()
          for index, line in enumerate(lines):
              if line.startswith("config "):
                  current = line.removeprefix("config ").strip()
              replacement = None
              if current.startswith("PACKAGE_") and line.strip() == "default m":
                  if current in required_defaults:
                      retained_defaults.add(current)
                  else:
                      replacement = "default n"
                      package_defaults += 1
              elif current in {"ALL", "ALL_KMODS", "ALL_NONSHARED", "BUILDBOT"} and \
                   line.strip() == "default y":
                  replacement = "default n"
              if replacement is not None:
                  indent = line[:len(line) - len(line.lstrip())]
                  ending = "\n" if line.endswith("\n") else ""
                  lines[index] = f"{indent}{replacement}{ending}"
          if package_defaults == 0 or retained_defaults != required_defaults:
              raise SystemExit("SDK package defaults were not found")
          with path.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write("".join(lines))
          PY
          printf '%s\n' \
            '# CONFIG_ALL is not set' \
            '# CONFIG_ALL_KMODS is not set' \
            '# CONFIG_ALL_NONSHARED is not set' \
            '# CONFIG_BUILDBOT is not set' \
            'CONFIG_PACKAGE_kmod-nf-tproxy=m' \
            'CONFIG_PACKAGE_luci-app-miclash=m' > .config
          make defconfig > /dev/null 2>&1
          grep -qx '# CONFIG_ALL is not set' .config
          grep -qx '# CONFIG_ALL_KMODS is not set' .config
          grep -qx '# CONFIG_ALL_NONSHARED is not set' .config
          grep -qx '# CONFIG_BUILDBOT is not set' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-miclash=m' .config
          grep -qx 'CONFIG_PACKAGE_kmod-nf-tproxy=m' .config
          selected_kmods="$(grep -Ec '^CONFIG_PACKAGE_kmod-.*=[ym]$' .config || true)"
          selected_modules="$(grep -Ec '^CONFIG_PACKAGE_.*=m$' .config || true)"
          test "$selected_kmods" -le 64
          test "$selected_modules" -le 64
          if grep -q '^CONFIG_PACKAGE_kmod-hwmon-nct6775=m$' .config; then
            echo "SDK-wide kernel modules remained selected." >&2
            exit 1
          fi
          make -j"$(nproc)" "package/${PACKAGE_NAME}/compile" V=s

          case "${{ matrix.pkg_type }}" in
            ipk)
              src="$(find "$SDK_HOME/bin" -type f -name "${PACKAGE_NAME}_*.ipk" | head -n 1)"
              dst="${{ github.workspace }}/${PACKAGE_NAME}_${TAG_VERSION}_all.ipk"
              ;;
            apk)
              src="$(find "$SDK_HOME/bin" -type f -name "${PACKAGE_NAME}-*.apk" | head -n 1)"
              dst="${{ github.workspace }}/${PACKAGE_NAME}-${TAG_VERSION}.apk"
              ;;
            *)
              echo "Unsupported package type: ${{ matrix.pkg_type }}" >&2
              exit 1
              ;;
          esac

          if [ -z "${src:-}" ] || [ ! -f "$src" ]; then
            echo "Built package not found for type ${{ matrix.pkg_type }}" >&2
            exit 1
          fi

          list_package_entries() {
            local pkg out outer work
            pkg="$1"
            out="$2"
            outer="$3"
            work="$(mktemp -d)"

            if [ "${pkg##*.}" = "apk" ] && [ -x "$SDK_HOME/staging_dir/host/bin/apk" ]; then
              mkdir -p "$work/extract"
              "$SDK_HOME/staging_dir/host/bin/apk" extract --allow-untrusted --destination "$work/extract" "$pkg" >/dev/null
              (cd "$work/extract" && find . -type f,l | sort) > "$out"
              rm -rf "$work"
              return 0
            fi

            if tar -tf "$pkg" > "$outer" 2>/dev/null; then
              if grep -Eq '(^|/)data\.tar(\.|$)' "$outer"; then
                tar -xf "$pkg" -C "$work"
                for payload in "$work"/data.tar "$work"/data.tar.*; do
                  if [ -f "$payload" ] && tar -tf "$payload" > "$out" 2>/dev/null; then
                    rm -rf "$work"
                    return 0
                  fi
                done
              else
                cp "$outer" "$out"
                rm -rf "$work"
                return 0
              fi
            fi

            if ar t "$pkg" >/dev/null 2>&1; then
              (cd "$work" && ar x "$pkg")
              for payload in "$work"/data.tar "$work"/data.tar.*; do
                if [ -f "$payload" ] && tar -tf "$payload" > "$out" 2>/dev/null; then
                  rm -rf "$work"
                  return 0
                fi
              done
            fi

            echo "Cannot inspect package contents: $pkg" >&2
            file "$pkg" >&2 || true
            rm -rf "$work"
            return 1
          }

          package_entries="$(mktemp)"
          package_outer_entries="$(mktemp)"
          list_package_entries "$src" "$package_entries" "$package_outer_entries"
          grep -Eq '(^|[.]/)www/luci-static/resources/view/miclash/editor.js$' "$package_entries"
          grep -Eq '(^|[.]/)www/luci-static/resources/view/miclash/ace/ace.js$' "$package_entries"
          grep -Eq '(^|[.]/)www/luci-static/resources/view/miclash/ace/mode-yaml.js$' "$package_entries"
          grep -Eq '(^|[.]/)www/luci-static/resources/view/miclash/ace/mode-text.js$' "$package_entries"
          grep -Eq '(^|[.]/)www/luci-static/resources/view/miclash/style.css$' "$package_entries"
          grep -Eq '(^|[.]/)usr/share/luci/menu.d/luci-app-miclash.json$' "$package_entries"
          grep -Eq '(^|[.]/)usr/sbin/miclashd$' "$package_entries"
          grep -Eq '(^|[.]/)usr/libexec/miclash/migrate\.uc$' "$package_entries"

          cp -v -f "$src" "$dst"
          RELEASE_FILENAME="$(basename "$dst")"
          SDK_RELEASE="${{ matrix.sdk_version }}"
          SDK_TARGET="${{ matrix.arch }}"
          PACKAGE_TYPE="${{ matrix.pkg_type }}"
          RELEASE_METADATA_PATH="${{ github.workspace }}/release-metadata.json"
          export RELEASE_FILENAME SDK_RELEASE SDK_TARGET PACKAGE_TYPE RELEASE_METADATA_PATH
          node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const metadata = {
            filename: process.env.RELEASE_FILENAME,
            sdk: { release: process.env.SDK_RELEASE, target: process.env.SDK_TARGET },
            package_type: process.env.PACKAGE_TYPE
          };
          writeFileSync(process.env.RELEASE_METADATA_PATH, `${JSON.stringify(metadata, null, 2)}\n`,
            { encoding: 'utf8', mode: 0o644 });
          NODE
          ls -lah "$dst"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.pkg_type }}-${{ matrix.sdk_version }}
          path: |
            *.${{ matrix.pkg_type }}
            release-metadata.json
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - sync-version
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Build And Verify Release Manifest
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_TAG_SHA: ${{ needs.sync-version.outputs.source_tag_sha }}
          SYNCED_BUILD_SHA: ${{ needs.sync-version.outputs.sync_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_TAG_SHA"
          node tools/build-release-manifest.mjs \
            --artifacts-dir artifacts \
            --output-dir release_files \
            --installer install-miclash.sh \
            --tag "$TAG_NAME" \
            --source-tag-sha "$SOURCE_TAG_SHA" \
            --synced-build-sha "$SYNCED_BUILD_SHA"
          node tools/check-release-manifest.mjs \
            --manifest release_files/miclash-release-manifest.json \
            --assets-dir release_files
          find release_files -maxdepth 1 -type f -name '*.sha256' -print -quit | grep -q .
          ls -lah release_files

      - name: Resolve Existing GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          release_json="$(mktemp)"
          status="$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$release_json" \
            -w "%{http_code}" \
            "$api/releases/tags/${TAG_NAME}")"

          if [ "$status" != "200" ]; then
            echo "Create the GitHub Release for this tag manually first, choose its Release label, then rerun this workflow." >&2
            cat "$release_json" >&2
            exit 1
          fi

          python3 - "$release_json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"upload_url={data['upload_url'].split('{', 1)[0]}")
          PY

      - name: Delete Existing Publication Manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          release_json="$(mktemp)"
          curl -sS --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/releases/tags/${GITHUB_REF_NAME}" > "$release_json"

          asset_id="$(python3 - "$release_json" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          ids = [str(asset["id"]) for asset in data.get("assets", [])
                 if asset.get("name") == "miclash-release-manifest.json"]
          if len(ids) > 1:
              raise SystemExit("duplicate existing publication manifests")
          if ids:
              print(ids[0])
          PY
          )"

          if [ -n "$asset_id" ]; then
            curl -sS --fail-with-body -L -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/releases/assets/${asset_id}"
          fi

      - name: Upload Non-Manifest Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          shopt -s nullglob
          files=(release_files/*)
          non_manifest=()
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if [[ $name != "miclash-release-manifest.json" ]]; then
              non_manifest+=("$file")
            fi
          done
          if [ "${#non_manifest[@]}" -eq 0 ]; then
            echo "No non-manifest release files found." >&2
            exit 1
          fi

          release_json="$(mktemp)"
          curl -sS --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/releases/tags/${GITHUB_REF_NAME}" > "$release_json"

          for file in "${non_manifest[@]}"; do
            name="$(basename "$file")"
            encoded_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$name")"
            asset_id="$(python3 - "$release_json" "$name" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          wanted = sys.argv[2]
          for asset in data.get("assets", []):
              if asset.get("name") == wanted:
                  print(asset["id"])
                  break
          PY
          )"

            if [ -n "$asset_id" ]; then
              curl -sS --fail-with-body -L -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/releases/assets/${asset_id}"
            fi

            curl -sS --fail-with-body -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "${UPLOAD_URL}?name=${encoded_name}"
          done

      - name: Verify Published Non-Manifest Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          release_json="$(mktemp)"
          expected="$(mktemp)"
          find release_files -maxdepth 1 -type f ! -name "miclash-release-manifest.json" \
            -printf '%f\n' | LC_ALL=C sort > "$expected"
          test -s "$expected"
          curl -sS --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/releases/tags/${GITHUB_REF_NAME}" > "$release_json"

          python3 - "$release_json" "$expected" <<'PY'
          import collections
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          published = collections.Counter(asset.get("name") for asset in release.get("assets", []))
          missing = [name for name in expected if published[name] == 0]
          duplicate = [name for name in expected if published[name] > 1]
          if missing or duplicate:
              raise SystemExit(f"missing={missing}; duplicate={duplicate}")
          if published["miclash-release-manifest.json"] != 0:
              raise SystemExit("publication manifest appeared before final upload")
          PY

      - name: Upload Publication Manifest Last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
        run: |
          set -euo pipefail

          manifest="release_files/miclash-release-manifest.json"
          test -f "$manifest" && test ! -L "$manifest" && test -s "$manifest"
          encoded_name="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("miclash-release-manifest.json", safe=""))')"
          curl -sS --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$manifest" \
            "${UPLOAD_URL}?name=${encoded_name}"
